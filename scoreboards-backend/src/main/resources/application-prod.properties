logging.level.root=WARN
logging.level.com.mikko_huttunen=INFO
logging.file.path=/var/log/tomcat
logging.file.name=spring.log
server.port=${SERVER_PORT}
app.cors.allowed-origins=https://scoreboards.games,https://www.scoreboards.games
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# MongoDB
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}

# MongoDB settings
logging.level.org.springframework.data.mongodb=INFO
spring.data.mongodb.auto-index-creation=true

# Auth0
okta.oauth2.issuer=${OKTA_OAUTH2_ISSUER}
okta.oauth2.audience=${OKTA_OAUTH2_AUDIENCE}
auth0.domain=${AUTH0_DOMAIN}
auth0.clientId=${AUTH0_CLIENT_ID}
auth0.clientSecret=${AUTH0_CLIENT_SECRET}

# AWS
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}